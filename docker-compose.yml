services:
  db:
    image: pgvector/pgvector:pg16
    container_name: manverse_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: manverse_redis
    restart: always

  # ── Auto migration on every deploy ───────────────────────────
  migrate:
    build: ./backend
    container_name: manverse_migrate
    command: >
      sh -c "cd /app/config &&
             python manage.py makemigrations --no-input &&
             python manage.py migrate --no-input &&
             python manage.py collectstatic --no-input --clear && python manage.py ingest_knowledge"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/1
      BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID}
      SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD}
      SSLCOMMERZ_IS_LIVE: ${SSLCOMMERZ_IS_LIVE}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    volumes:
      - /home/manverse/static:/app/config/staticfiles
      - /home/manverse/media:/app/config/media
    restart: on-failure

  backend:
    build: ./backend
    container_name: manverse_backend
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/1
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID}
      SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD}
      SSLCOMMERZ_IS_LIVE: ${SSLCOMMERZ_IS_LIVE}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - /home/manverse/static:/app/config/staticfiles
      - /home/manverse/media:/app/config/media

  celery:
    build: ./backend
    container_name: manverse_celery
    restart: always
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/1
      BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    volumes:
      - /home/manverse/static:/app/config/staticfiles
      - /home/manverse/media:/app/config/media

  frontend:
    build:
      context: ./frontend/frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_STRIPE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    container_name: manverse_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_STRIPE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      BACKEND_URL: http://backend:8000

volumes:
  postgres_data: