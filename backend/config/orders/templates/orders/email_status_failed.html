<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { font-family: Arial, sans-serif; background:#f4f4f4; margin:0; padding:0; }
  .wrap { max-width:600px; margin:30px auto; background:#fff; border-radius:8px; overflow:hidden; }
  .hdr  { background:#111; color:#fff; padding:24px 32px; }
  .hdr h1 { margin:0; font-size:20px; letter-spacing:3px; }
  .hdr p  { margin:4px 0 0; font-size:12px; color:#aaa; }
  .badge { display:inline-block; background:#b45309; color:#fff; padding:6px 14px;
           border-radius:20px; font-size:12px; font-weight:bold; margin-bottom:16px; }
  .body { padding:32px; }
  .code { background:#f8f8f8; border-left:4px solid #b45309; padding:12px 16px;
          font-size:17px; font-weight:bold; font-family:monospace; margin-bottom:24px; }
  .info { background:#faf7f2; padding:16px; border-radius:6px; font-size:13px; line-height:1.9; }
  .btn  { display:inline-block; margin-top:20px; background:#d97706; color:#fff;
          padding:12px 28px; border-radius:6px; text-decoration:none; font-weight:bold; font-size:13px; }
  .ftr  { padding:18px 32px; background:#f4f4f4; text-align:center; font-size:11px; color:#999; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>MANVERSE</h1>
    <p>Payment Failed</p>
  </div>
  <div class="body">
    <div class="badge">⚠ Payment Failed</div>
    <p>Hi <strong>{{ full_name }}</strong>, unfortunately your payment could not be processed.</p>
    <div class="code">Order Code: {{ tran_id }}</div>
    <div class="info">
      <strong>Order Total:</strong> ৳{{ total }}<br>
      <strong>Payment Method:</strong> {{ payment_method }}<br>
      Please try again or use a different payment method.
    </div>
    <a href="{{ site_url }}/checkout" class="btn">Try Again →</a>
  </div>
  <div class="ftr">© Manverse &nbsp;|&nbsp; <a href="{{ site_url }}">{{ site_url }}</a></div>
</div>
</body>
</html>
